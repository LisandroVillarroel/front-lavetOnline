<div class="formContainer">
  <!--<form class="custom-form" method="post">-->
  <div class="form">
    <div class="custom-form" [formGroup]="loginForm" name="loginForm">
      <h4 class="text-center">Bienvenido</h4>
      <div class="centarImagen mb-2"><img alt="sin imagen" class="mb-2 formatoImagen"
          src="./assets/imagenes/login/logoVerdeLineal.png"></div>
      <mat-form-field class="example-full-width">
        <mat-label>Usuario</mat-label>
        <input type="text" matInput [formControl]="usuario" [ngClass]="{ 'is-invalid': submitted && usuario.errors }">
        <mat-icon matPrefix>perm_identity</mat-icon>
      </mat-form-field>
      <mat-form-field class="example-full-width">
        <mat-label>Contraseña</mat-label>
        <input type="password" matInput [formControl]="contrasena"
          [ngClass]="{ 'is-invalid': submitted && contrasena.errors }">
        <mat-icon matPrefix>vpn_key</mat-icon>
      </mat-form-field>
      <div class="formatoOlvidoContrasena">
        @if(validaCuenta()){
        <div class="m-0 p-1" [ngClass]="{ 'alert': mensaje, 'alert-danger':mensaje}">{{mensaje()}}</div>
        }
        <button class="formatoLetra" (click)="restContrasena()" mat-button>He olvidado mi contraseña</button>
      </div>
    </div>

    <div class="row col-md-12">
      <button class="button-ingreso" (click)="enviar()" [disabled]="loginForm.invalid">Ingresar Sesión </button>
