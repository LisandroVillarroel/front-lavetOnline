<div class="pt-1">
  <div class="col-md-12">
    <h4 class="text-center">Flujo de Caja</h4>
  </div>
</div>

<div class="content ml-2 mr-2">
  <div class="row mb-2">
    <div class="col-md-10">
      <mat-form-field class="inputBuscar">
        <input matInput (keyup)="applyFilter($event)" placeholder="Buscar">
      </mat-form-field>
    </div>
    <div class="col-md-2">
      <mat-form-field class="inputFecha">
        <mat-label>Mes</mat-label>
        <input matInput [matDatepicker]="dp" [formControl]="anoMes">
        <mat-hint>MM/YYYY</mat-hint>
        <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
        <mat-datepicker #dp startView="multi-year" (monthSelected)="setMonthAndYear($event, dp)"
          panelClass="example-month-picker">
        </mat-datepicker>
      </mat-form-field>

    </div>
  </div>

  <div class="mat-elevation-z8">

    <table mat-table matTableExporter [dataSource]="dataSource" #exporter="matTableExporter" multiTemplateDataRows
      matSort>


      <!-- ID Index -->
      <ng-container matColumnDef="index">
        <th id='indexI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 5%;'> N° </th>
        <td mat-cell *matCellDef="let row; let i = dataIndex;" style=' width: 5%;'>
          {{(i+1) + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
      </ng-container>

      <!-- ID Column -->
      <ng-container matColumnDef="fechaMes">
        <th id='fechaMesI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 15%;'>FECHA</th>
        <td mat-cell *matCellDef="let row" style=' width: 15%;'> {{row.fechaMes}} </td>
      </ng-container>

      <!-- Progress Column -->
      <ng-container matColumnDef="cuenta">
        <th id='cuentaI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 20%;'> CUENTA </th>
        <td mat-cell *matCellDef="let row" style=' width: 20%;'> {{row.cuenta}} </td>
      </ng-container>

      <!-- Fecha Facturación Column -->
      <ng-container matColumnDef="montoFijo">
        <th id='montoFijoI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 15%;'> MONTO FIJO </th>
        <td mat-cell *matCellDef="let row" style=' width: 15%;'> ${{row.montoFijo | number }} </td>
      </ng-container>

      <!-- num Facturación Column -->
      <ng-container matColumnDef="cargos">
        <th id='cargosI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 15%;'> CARGOS </th>
        <td mat-cell *matCellDef="let row" style=' width: 15%;'> ${{row.cargos | number }} </td>
      </ng-container>

      <ng-container matColumnDef="abonos">
        <th id='abonosI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 15%;'> ABONOS </th>
        <td mat-cell *matCellDef="let row" style=' width: 15%;'> ${{row.abonos  | number}} </td>
      </ng-container>

      <ng-container matColumnDef="opciones">
        <th id='opcionesI' mat-header-cell *matHeaderCellDef style=' width: 15%; text-align: center'>
          <button matTooltip="Agregar" mat-icon-button color="accent" class="nuevo" (click)="agregaNuevo()">
            <mat-icon>add</mat-icon>
          </button>
        </th>

        <td mat-cell *matCellDef="let row; let i=index;" style=' width: 15%; text-align: center'>

          <button matTooltip="Modificar" mat-icon-button color="accent" style="size:5px"
            (click)="AsignaFichaFactura(row.fechaFacturacion,row.idCliente)">
            <mat-icon>edit</mat-icon>
          </button>

          <button matTooltip="Consultar" mat-icon-button color="accent"
            (click)="consultaFacturado(row.numFactura,row.idCliente)">
            <mat-icon>search</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="example-element-row"></tr>
    </table>

    <mat-paginator #myPaginator [pageSizeOptions]="[10, 20, 30, 100]"></mat-paginator>


  </div>
  <div>
    <button mat-raised-button class="colorFondoBotonBusca"
      (click)="exporter.exportTable('xlsx', {fileName:nombreArchivo,sheet: 'facturas', Props: {Author: 'Silave'}, columnWidths: [50, 5, 3]})">Excel</button>
    <button mat-raised-button class="colorFondoBotonBusca"
      (click)="exporter.exportTable('csv', {fileName:nombreArchivo})">Csv</button>
    <button mat-raised-button class="colorFondoBotonBusca"
      (click)="exporter.exportTable('json', {fileName:nombreArchivo})">Json</button>
    <button mat-raised-button class="colorFondoBotonBusca"
      (click)="exporter.exportTable('txt', {fileName:nombreArchivo})">Txt</button>
  </div>
</div>
