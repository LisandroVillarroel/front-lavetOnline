<h2 mat-dialog-title>CONSULTA FICHA - {{data.fichaC.numeroFicha}}</h2>
<mat-dialog-content  name="consulta" class="consulta-container">
    <div class="row align-items-center ">
        <div class="col-md-12">
          <mat-form-field class="inputInput">
            <mat-label class="labelI">Cliente</mat-label>
            <input matInput  value="{{data.fichaC.cliente.nombreFantasia}}" disabled='true' >
          </mat-form-field>

        </div>
    </div>

    <mat-divider class="mt-3 mb-3"></mat-divider>


    <div class="row align-items-center ">
      <div class="col-md-6 ">
        <mat-form-field class="inputInput">
          <mat-label class="labelI">Propietario</mat-label>
          <input matInput  value="{{data.fichaC.nombrePropietario}}" disabled='true' >
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field class="inputInput">
          <mat-label class="labelI">Paciente</mat-label>
          <input matInput  value="{{data.fichaC.nombrePaciente}}" disabled='true' >
        </mat-form-field>
      </div>
    </div>

    <div class="row align-items-center">
      <div class="col-md-4">
        <mat-form-field class="inputInput">
          <mat-label class="labelI">Edad</mat-label>
          <input matInput  value="{{data.fichaC.edadPaciente}}" disabled='true' >
        </mat-form-field>
      </div>
      <div class="col-md-4 ">
        <mat-form-field class="inputInput">
          <mat-label class="labelI">Especie</mat-label>
          <input matInput value="{{data.fichaC.especie.nombre}}" disabled='true' >
        </mat-form-field>
      </div>
      <div class="col-md-4 ">
        <mat-form-field class="inputInput">
          <mat-label class="labelI">Raza</mat-label>
          <input matInput  value="{{data.fichaC.raza.nombre}}" disabled='true' >
        </mat-form-field>
      </div>
    </div>

    <div class="row align-items-center">
      <div class="col-md-4 ">
        <mat-form-field class="inputInput">
          <mat-label class="labelI">Sexo</mat-label>
          <input matInput  value="{{data.fichaC.sexo}}" disabled='true' >
        </mat-form-field>
      </div>
      <div class="col-md-8">

        <mat-form-field class="inputInput">
          <mat-label class="labelI">Dr. Solicitante</mat-label>
          <input matInput  value="{{data.fichaC.doctorSolicitante.nombreDoctorSolicitante}}" disabled='true' >
        </mat-form-field>
      </div>
    </div>

    <div class="row align-items-center">
      <div class="col-md-6 ">
        <mat-form-field class="inputInput">
          <mat-label class="labelI">EXAMEN</mat-label>
          <input matInput placeholder="EXAMEN"  value="{{data.fichaC.examen.nombre}}" disabled='true' >
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field class="inputInput">
          <mat-label class="labelI">Usuario Responsable EXAMEN</mat-label>
          <input matInput  value="{{data.usuarioAsignado.nombreCompleto}}" disabled='true' >
        </mat-form-field>
      </div>
    </div>

    <div class="row align-items-center">
      <div class="col-md-6 ">
        <mat-form-field class="inputInput">
          <mat-label class="labelI">Email Propietario</mat-label>
          <input matInput  value="{{data.fichaC.correoClienteFinal}}" disabled='true' >
        </mat-form-field>
      </div>
    </div>

</mat-dialog-content>


<mat-dialog-actions class="justify-content-center">
  <div class="col-md-6">
    <button mat-raised-button class="colorFondoBotonCancelar"  mat-dialog-close  [disabled]=false>CERRAR</button>
  </div>
</mat-dialog-actions>
