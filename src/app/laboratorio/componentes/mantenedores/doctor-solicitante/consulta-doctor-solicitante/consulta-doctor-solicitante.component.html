<h2 mat-dialog-title>CONSULTA DOCTOR SOLICITANTE</h2>

<mat-dialog-content name="consulta" class="consulta-container">
  <mat-form-field class="inputInput">
    <mat-label class="labelI">Nombre Doctor Solicitante</mat-label>
    <input matInput value="{{ data.nombre }}" disabled="true" />
  </mat-form-field>

  <mat-form-field class="inputInput">
    <mat-label class="labelI">Nombre Cliente</mat-label>
    <input matInput value="{{ data.cliente.nombreFantasia }}" disabled="true" />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions class="justify-content-center">
  <div class="col-md-6">
    <button
      mat-raised-button
      class="colorFondoBotonCancelar"
      mat-dialog-close
      [disabled]="false"
    >
      CERRAR
    </button>
  </div>
</mat-dialog-actions>
