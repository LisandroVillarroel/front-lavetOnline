<h2 mat-dialog-title>MODIFICA DOCTOR SOLICITANTE</h2>

<mat-dialog-content
  [formGroup]="modificaDoctorSolicitante()"
  name="modifica"
  class="modifica-container"
>
  <mat-form-field class="inputInput">
    <mat-label class="labelI">Nombre Doctor Solicitante</mat-label>
    <input matInput [formControl]="nombre" required />
    @if (nombre.invalid) {
    <mat-error>{{ getErrorMessage("nombre") }}</mat-error>
    }
  </mat-form-field>

  <mat-form-field class="inputInput">
    <mat-label class="labelI">Nombre Cliente</mat-label>
    <input matInput value="{{ data.cliente.nombreFantasia }}" disabled="true" />
  </mat-form-field>
  <!--
  <mat-form-field class="inputSelect">
    <mat-label class="labelI">Cliente</mat-label>
    <mat-select [formControl]="idCliente" [compareWith]="comparaSelecciona" >
      <mat-option *ngFor="let _cliente of datoCliente" [value]="_cliente">
        {{_cliente.nombreFantasia}}
      </mat-option>
    </mat-select>
    <mat-error *ngIf="idCliente.invalid">{{getErrorMessage('idCliente')}}</mat-error>
  </mat-form-field>
</mat-dialog-content>
-->
  <mat-dialog-actions>
    <div class="col-md-6">
      <button
        mat-raised-button
        class="colorFondoBotonCancelar"
        mat-dialog-close
        [disabled]="false"
      >
        CANCELAR
      </button>
    </div>
    <div class="col-md-6">
      <button
        class="colorFondoBotonGrabar"
        mat-raised-button
        (click)="enviar()"
        [disabled]="modificaDoctorSolicitante().invalid"
      >
        GRABAR
      </button>
    </div>
  </mat-dialog-actions>
</mat-dialog-content>
