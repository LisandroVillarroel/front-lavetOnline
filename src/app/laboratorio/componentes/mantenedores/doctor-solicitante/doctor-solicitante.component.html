<div class="pt-1">
  <div class="col-md-12">
    <h4 class="text-center">Mantenedor Doctor Solicitante</h4>
  </div>
</div>

<div class="row">
  <div class="col-md-3 d-flex align-items-center justify-content-end">
    <button
      mat-raised-button
      class="colorFondoBotonExTabla"
      (click)="
        exporter.exportTable('xlsx', {
          fileName: nombreArchivo,
          sheet: 'facturas',
          Props: { Author: 'Silave' },
          columnWidths: [50, 5, 3]
        })
      "
    >
      Excel
    </button>
    <button
      mat-raised-button
      class="colorFondoBotonExTabla"
      (click)="exporter.exportTable('csv', { fileName: nombreArchivo })"
    >
      Csv
    </button>
    <button
      mat-raised-button
      class="colorFondoBotonExTabla"
      (click)="exporter.exportTable('json', { fileName: nombreArchivo })"
    >
      Json
    </button>
    <button
      mat-raised-button
      class="colorFondoBotonExTabla"
      (click)="exporter.exportTable('txt', { fileName: nombreArchivo })"
    >
      Txt
    </button>
  </div>
  <div class="col-md-9 ml-2 mr-2">
    <mat-form-field class="inputBuscar">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput (keyup)="applyFilter($event)" placeholder="Buscar" />
    </mat-form-field>
  </div>
</div>

<table
  mat-table
  [dataSource]="dataSource"
  matTableExporter
  #exporter="matTableExporter"
  multiTemplateDataRows
  matSort
>
  <!-- ID Index -->
  <ng-container matColumnDef="index">
    <th
      id="indexI"
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
      style="width: 3%"
    >
      N°
    </th>
    <td mat-cell *matCellDef="let row; let i = dataIndex" style="width: 3%">
      {{ i + 1 + myPaginator.pageIndex * myPaginator.pageSize }}
    </td>
  </ng-container>

  <!-- ID Column -->
  <ng-container matColumnDef="nombre">
    <th
      id="nombreI"
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
      style="width: 41%"
    >
      NOMBRE SOLICITANTE
    </th>
    <td mat-cell *matCellDef="let row" style="width: 41%">{{ row.nombre }}</td>
  </ng-container>

  <!-- NOMBRE CLIENTE Column -->
  <ng-container matColumnDef="cliente:{nombreFantasia}">
    <th
      id="nombreFantasiaI"
      mat-header-cell
      *matHeaderCellDef
      mat-sort-header
      style="width: 41%"
    >
      NOMBRE CLIENTE
    </th>
    <td mat-cell *matCellDef="let row" style="width: 41%">
      {{ row.cliente.nombreFantasia }}
    </td>
  </ng-container>

  <!-- IDCLIENTE Column -->
  <!--
     <ng-container matColumnDef="cliente:{IdCliente}">
      <th id='IdClienteI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 0%;'> IDCLIENTE</th>
      <td mat-cell *matCellDef="let row"style=' width: 0%;'> {{row.cliente.IdCliente}} </td>
    </ng-container>
-->

  <ng-container matColumnDef="opciones">
    <th
      id="opcionesI"
      mat-header-cell
      *matHeaderCellDef
      style="width: 15%; text-align: center"
    >
      <button
        matTooltip="Agregar"
        mat-icon-button
        class="nuevo"
        (click)="agregaNuevo()"
      >
        <mat-icon>add</mat-icon>
      </button>
    </th>

    <td
      mat-cell
      *matCellDef="let row; let i = index"
      style="width: 15%; text-align: center"
    >
      <button
        matTooltip="Modificar"
        mat-icon-button
        class="tabla"
        style="size: 5px"
        (click)="
          actualizaDoctorSolicitante(
            row._id,
            row.nombre,
            row.cliente.idCliente,
            row.cliente.nombreFantasia
          )
        "
      >
        <mat-icon>edit</mat-icon>
      </button>

      <button
        matTooltip="Consultar"
        mat-icon-button
        class="tabla"
        (click)="
          consultaDoctorSolicitante(
            row._id,
            row.nombre,
            row.cliente.idCliente,
            row.cliente.nombreFantasia
          )
        "
      >
        <mat-icon>search</mat-icon>
      </button>

      <button
        matTooltip="Eliminar"
        mat-icon-button
        class="tabla"
        (click)="
          eliminaDoctorSolicitante(
            row._id,
            row.nombre,
            row.cliente.idCliente,
            row.cliente.nombreFantasia
          )
        "
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns"
    class="example-element-row"
  ></tr>
</table>

<mat-paginator
  #myPaginator
  [pageSizeOptions]="[10, 20, 30, 100]"
></mat-paginator>
