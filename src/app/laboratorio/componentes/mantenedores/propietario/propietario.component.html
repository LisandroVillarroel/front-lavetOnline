<div class="pt-1">
  <div class="col-md-12">
    <h4 class="text-center">Mantenedor Propietario</h4>
  </div>
</div>

<div class="row">
  <div class="col-md-3 d-flex align-items-center justify-content-end">
    <button mat-raised-button class="colorFondoBotonExTabla" (click)="
        exporter.exportTable('xlsx', {
          fileName: nombreArchivo,
          sheet: 'facturas',
          Props: { Author: 'Silave' },
          columnWidths: [50, 5, 3]
        })
      ">
      Excel
    </button>
    <button mat-raised-button class="colorFondoBotonExTabla"
      (click)="exporter.exportTable('csv', { fileName: nombreArchivo })">
      Csv
    </button>
    <button mat-raised-button class="colorFondoBotonExTabla"
      (click)="exporter.exportTable('json', { fileName: nombreArchivo })">
      Json
    </button>
    <button mat-raised-button class="colorFondoBotonExTabla"
      (click)="exporter.exportTable('txt', { fileName: nombreArchivo })">
      Txt
    </button>
  </div>
  <div class="col-md-9 ml-2 mr-2">
    <mat-form-field class="inputBuscar">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput (keyup)="applyFilter($event)" placeholder="Buscar" />
    </mat-form-field>
  </div>
</div>

<table mat-table [dataSource]="dataSource" matTableExporter #exporter="matTableExporter" multiTemplateDataRows matSort>

  <!-- ID Index -->
  <ng-container matColumnDef="index">
    <th id='indexI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 3%;'> N° </th>
    <td mat-cell *matCellDef="let row; let i = dataIndex;" style=' width: 3%;'>
      {{(i+1) + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
  </ng-container>

  <!-- ID Column -->
  <ng-container matColumnDef="rutPropietario">
    <th id='_rutPropietarioI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 7%;'> RUT</th>
    <td mat-cell *matCellDef="let row" style=' width: 7%;'> {{row.rutPropietario}} </td>
  </ng-container>

  <!-- Progress Column -->
  <ng-container matColumnDef="nombres">
    <th id='_nombresI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 15%;'> NOMBRES </th>
    <td mat-cell *matCellDef="let row" style=' width: 15%;'> {{row.nombres}} </td>
  </ng-container>

  <!-- Titulo Column -->
  <ng-container matColumnDef="apellidoPaterno">
    <th id='_apellidoPaternoI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 15%;'> APELLIDO PATERNO
    </th>
    <td mat-cell *matCellDef="let row" style=' width: 15%;'> {{row.apellidoPaterno}} </td>
  </ng-container>

  <ng-container matColumnDef="apellidoMaterno">
    <th id='_apellidoMaternoI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 15%;'> APELLIDO MATERNO
    </th>
    <td mat-cell *matCellDef="let row" style=' width: 15%;'> {{row.apellidoMaterno}} </td>
  </ng-container>

  <ng-container matColumnDef="direccion">
    <th id='direccionI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 20%;'> DIRECCIÓN </th>
    <td mat-cell *matCellDef="let row" style=' width: 20%;'> {{row.direccion}} </td>
  </ng-container>

  <ng-container matColumnDef="telefono">
    <th id='telefonoI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 5%;'> TELÉFONO </th>
    <td mat-cell *matCellDef="let row" style=' width: 5%;'> {{row.telefono}} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th id='emailI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 10%;'> EMAIL </th>
    <td mat-cell *matCellDef="let row" style=' width: 10%;'> {{row.email}} </td>
  </ng-container>

  <ng-container matColumnDef="opciones">
    <th id='opcionesI' mat-header-cell *matHeaderCellDef style=' width: 10%; text-align: center'>
      <button matTooltip="Agregar" mat-icon-button class="nuevo" (click)="agregaNuevo()">
        <mat-icon>add</mat-icon>
      </button>
    </th>

    <td mat-cell *matCellDef="let row; let i=index;" style=' width: 10%; text-align: center'>

      <button matTooltip="Modificar" mat-icon-button class="tabla" style="size:5px" (click)="actualiza(row)">
        <mat-icon>edit</mat-icon>
      </button>

      <button matTooltip="Consultar" mat-icon-button class="tabla" (click)="consulta(row)">
        <mat-icon>search</mat-icon>
      </button>

      <button matTooltip="Eliminar" mat-icon-button class="tabla" (click)="elimina(row)">
        <mat-icon>delete</mat-icon>
      </button>

    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="example-element-row"></tr>
</table>

<mat-paginator #myPaginator [pageSizeOptions]="[10, 20, 30, 100]"></mat-paginator>
