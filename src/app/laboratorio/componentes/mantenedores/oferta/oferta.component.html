<div class="pt-1" >
  <div class="col-md-12">
    <h4 class="text-center">Mantenedor Ofertas</h4>
  </div>
</div>

<div class="row">
  <div class="col-md-3 d-flex align-items-center justify-content-end">
    <button mat-raised-button class="colorFondoBotonExTabla" (click)="
        exporter.exportTable('xlsx', {
          fileName: nombreArchivo,
          sheet: 'facturas',
          Props: { Author: 'Silave' },
          columnWidths: [50, 5, 3]
        })
      ">
      Excel
    </button>
    <button mat-raised-button class="colorFondoBotonExTabla"
      (click)="exporter.exportTable('csv', { fileName: nombreArchivo })">
      Csv
    </button>
    <button mat-raised-button class="colorFondoBotonExTabla"
      (click)="exporter.exportTable('json', { fileName: nombreArchivo })">
      Json
    </button>
    <button mat-raised-button class="colorFondoBotonExTabla"
      (click)="exporter.exportTable('txt', { fileName: nombreArchivo })">
      Txt
    </button>
  </div>
  <div class="col-md-9 ml-2 mr-2">
    <mat-form-field class="inputBuscar">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput (keyup)="applyFilter($event)" placeholder="Buscar" />
    </mat-form-field>
  </div>
</div>


<table mat-table [dataSource]="dataSource" matTableExporter #exporter="matTableExporter" multiTemplateDataRows matSort>
     <!-- ID Index -->
     <ng-container matColumnDef="index">
        <th id='indexI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 5%;'> N° </th>
        <td mat-cell *matCellDef="let row; let i = dataIndex;"style=' width: 5%;'> {{(i+1) + (myPaginator.pageIndex * myPaginator.pageSize)}} </td>
      </ng-container>

      <ng-container matColumnDef="detalleOferta" >
        <th  id='detalleOfertaI' mat-header-cell *matHeaderCellDef  style='width: 10%; text-align: center'>DETALLE </th>

        <td  mat-cell *matCellDef="let row; let i=index;" style=' width: 10%;text-align: center'>
          <button matTooltip="Detalle Exámenes" mat-icon-button (click)="detalleExamenesOferta(row)" style="padding-left: 5px;" >
          <mat-icon>dehaze</mat-icon>
          </button>

        </td>
      </ng-container>

    <!-- ID Column -->
    <ng-container matColumnDef="nombre">
      <th id='nombreI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 25%;'> NOMBRE OFERTA</th>
      <td mat-cell *matCellDef="let row"style=' width: 25%;'> {{row.nombre}} </td>
    </ng-container>

    <!-- Progress Column -->
    <ng-container matColumnDef="fechaDesde">
      <th id='fechaDesdeI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 13%;'> FECHA HASTA </th>
      <td mat-cell *matCellDef="let row"  style=' width: 13%;'> {{row.fechaDesde  | date:'dd-MM-yyyy'}} </td>
    </ng-container>

    <!-- Titulo Column -->
    <ng-container matColumnDef="fechaHasta">
      <th id='fechaHastaI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 13%;'> FECHA HASTA </th>
      <td mat-cell *matCellDef="let row" style=' width: 13%;'> {{row.fechaHasta  | date:'dd-MM-yyyy'}} </td>
    </ng-container>

    <ng-container matColumnDef="montoTotal">
      <th id='montoTotalI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 9%;'> MONTO </th>
      <td mat-cell *matCellDef="let row" style=' width: 9%;'> ${{row.montoTotal | number}} </td>
    </ng-container>

    <ng-container matColumnDef="estadoOferta">
      <th id='estadoOfertaI' mat-header-cell *matHeaderCellDef mat-sort-header style=' width: 10%;'> ESTADO OFERTA </th>
      <td mat-cell *matCellDef="let row" style=' width: 10%;'> {{row.estadoOferta}} </td>
    </ng-container>



    <ng-container matColumnDef="opciones" >
      <th id='opcionesI' mat-header-cell *matHeaderCellDef  style=' width: 15%; text-align: center'>
        <button matTooltip="Agregar" mat-icon-button color="accent" class="nuevo" (click)="agregaNuevo()">
          <mat-icon>add</mat-icon>
        </button>
      </th>

      <td mat-cell *matCellDef="let row; let i=index;" style=' width: 15%; text-align: center'>

        <button matTooltip="Modificar" mat-icon-button color="accent" style="size:5px" (click)="actualizaOferta(row)">
          <mat-icon>edit</mat-icon>
        </button>

        <button matTooltip="Eliminar" mat-icon-button color="accent" (click)="eliminaOferta(row)">
          <mat-icon>delete</mat-icon>
        </button>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="example-element-row"></tr>
  </table>

  <mat-paginator #myPaginator [pageSizeOptions]="[10, 20, 30, 100]"></mat-paginator>
