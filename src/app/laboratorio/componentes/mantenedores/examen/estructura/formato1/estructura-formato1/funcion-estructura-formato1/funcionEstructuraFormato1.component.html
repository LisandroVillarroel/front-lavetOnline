<h2 mat-dialog-title>FUNCION ESTRUCTURA</h2>
<div class="row">
  <div class="col-6">
    <mat-table [dataSource]="dataSource" multiTemplateDataRows matSort>
      <!-- ID Index -->
      <ng-container matColumnDef="index">
        <th
          id="indexI"
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          style="width: 5%"
        >
          N°
        </th>
        <td mat-cell *matCellDef="let row; let i = dataIndex" style="width: 5%">
          {{ i + 1 }}
        </td>
      </ng-container>

      <!-- DESCRIPCIÓN Column -->
      <ng-container matColumnDef="ordenEstructura">
        <th
          id="ordenEstructuraI"
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          style="width: 6%"
        >
          ORDEN
        </th>
        <td mat-cell *matCellDef="let row" style="width: 6%">
          {{ row.ordenEstructura }}
        </td>
      </ng-container>

      <!-- DESCRIPCIÓN Column -->
      <ng-container matColumnDef="descripcion">
        <th
          id="descripcionI"
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          style="width: 20%"
        >
          DESCRIPCIÓN
        </th>
        <td mat-cell *matCellDef="let row" style="width: 20%">
          {{ row.descripcion }}
        </td>
      </ng-container>

      <!-- UNIDADMEDIDA  Column -->
      <ng-container matColumnDef="unidadMedida">
        <th
          id="unidadMedidaI"
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          style="width: 10%"
        >
          UNIDAD MEDIDA
        </th>
        <td mat-cell *matCellDef="let row" style="width: 10%">
          {{ row.unidadMedida }}
        </td>
      </ng-container>

      <!-- RESULTADO Column -->
      <ng-container matColumnDef="resultado">
        <th
          id="resultadoI"
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          style="width: 10%"
        >
          RESULTADO
        </th>
        <td mat-cell *matCellDef="let row" style="width: 10%">
          {{ row.resultado }}
        </td>
      </ng-container>

      <!-- REFERENCIA Column -->
      <ng-container matColumnDef="referencia">
        <th
          id="referenciaI"
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          style="width: 10%"
        >
          REFERENCIA
        </th>
        <td mat-cell *matCellDef="let row" style="width: 10%">
          {{ row.referencia }}
        </td>
      </ng-container>

      <!-- Horas LÓGICA Column -->
      <ng-container matColumnDef="logica">
        <th
          id="logicaI"
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          style="width: 7%"
        >
          LÓGICA
        </th>
        <td mat-cell *matCellDef="let row" style="width: 7%">
          {{ row.logica }}
        </td>
      </ng-container>

      <!-- codigo DESDE Column -->
      <ng-container matColumnDef="desde">
        <th
          id="desdeI"
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          style="width: 7%"
        >
          DESDE
        </th>
        <td mat-cell *matCellDef="let row" style="width: 7%">
          {{ row.desde }}
        </td>
      </ng-container>

      <!-- Formato del HASTA Column -->
      <ng-container matColumnDef="hasta">
        <th
          id="hastaI"
          mat-header-cell
          *matHeaderCellDef
          mat-sort-headerstyle="width: 9%"
        >
          HASTA
        </th>
        <td mat-cell *matCellDef="let row" style="width: 9%">
          {{ row.hasta }}
        </td>
      </ng-container>

      <ng-container matColumnDef="opciones">
        <th
          id="opcionesI"
          mat-header-cell
          *matHeaderCellDef
          style="width: 16%; text-align: center"
        ></th>

        <td
          mat-cell
          *matCellDef="let row; let i = index"
          style="width: 16%; text-align: center"
        ></td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr
        mat-row
        (click)="seleccionaParametro(row)"
        *matRowDef="let row; columns: displayedColumns"
        class="example-element-row"
      ></tr>
    </mat-table>
  </div>
  <div class="col-6">
    <section>
      <div class="example-button-row">
        <button mat-stroked-button (click)="creaFormula('(', '')">(</button>
        <button mat-stroked-button (click)="creaFormula('+', '')">+</button>
        <button mat-stroked-button (click)="creaFormula('-', '')">-</button>
        <button mat-stroked-button (click)="creaFormula('*', '')">*</button>
        <button mat-stroked-button (click)="creaFormula('/', '')">/</button>
        <button mat-stroked-button (click)="creaFormula(')', '')">)</button>
        &nbsp;&nbsp;
        <button
          mat-stroked-button
          matTooltip="Borra toda la formula"
          (click)="creaFormula('borrar', '')"
        >
          <mat-icon>backspace</mat-icon>
        </button>

        <br />

        <button mat-stroked-button (click)="creaFormula('0', '')">0</button>
        <button mat-stroked-button (click)="creaFormula('1', '')">1</button>
        <button mat-stroked-button (click)="creaFormula('2', '')">2</button>
        <button mat-stroked-button (click)="creaFormula('3', '')">3</button>
        <button mat-stroked-button (click)="creaFormula('4', '')">4</button>
        <button mat-stroked-button (click)="creaFormula('5', '')">5</button>
        <button mat-stroked-button (click)="creaFormula('6', '')">6</button>
        <button mat-stroked-button (click)="creaFormula('7', '')">7</button>
        <button mat-stroked-button (click)="creaFormula('8', '')">8</button>
        <button mat-stroked-button (click)="creaFormula('9', '')">9</button>
        <button mat-stroked-button (click)="creaFormula('.', '')">.</button>
      </div>
    </section>

    <mat-card class="example-card" appearance="outlined">
      <mat-card-header>
        <mat-card-title>Formula</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="fuente">{{ formula() }}</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>

<mat-dialog-actions>
  <div class="col-md-6">
    <button
      mat-raised-button
      class="colorFondoBotonCancelar"
      mat-dialog-close
      [disabled]="false"
    >
      CANCELAR
    </button>
  </div>
  <div class="col-md-6">
    <button
      class="colorFondoBotonGrabar"
      mat-raised-button
      (click)="enviar()"
      [disabled]=""
    >
      GRABAR
    </button>
  </div>
</mat-dialog-actions>
