<div class="container">
  <div class="pt-1">
    <div class="col-md-12">
      <h4 class="text-center">
        DETALLE - {{ estructuraDetalleInicio_().nombreExamen }}
      </h4>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="row">
        <div class="col-md-5 d-flex align-items-center justify-content-end">
          <button
            mat-raised-button
            class="colorFondoBotonExTabla"
            (click)="
              exporter.exportTable('xlsx', {
                fileName: nombreArchivo,
                sheet: 'facturas',
                Props: { Author: 'Silave' },
                columnWidths: [50, 5, 3]
              })
            "
          >
            Excel
          </button>
          <button
            mat-raised-button
            class="colorFondoBotonExTabla"
            (click)="exporter.exportTable('csv', { fileName: nombreArchivo })"
          >
            Csv
          </button>
          <button
            mat-raised-button
            class="colorFondoBotonExTabla"
            (click)="exporter.exportTable('json', { fileName: nombreArchivo })"
          >
            Json
          </button>
          <button
            mat-raised-button
            class="colorFondoBotonExTabla"
            (click)="exporter.exportTable('txt', { fileName: nombreArchivo })"
          >
            Txt
          </button>
        </div>
        <div class="col-md-7 ml-2 mr-2">
          <mat-form-field class="inputBuscar">
            <mat-icon matPrefix>search</mat-icon>
            <input
              matInput
              (keyup)="applyFilter($event)"
              placeholder="Buscar"
            />
          </mat-form-field>
        </div>
      </div>

      <table
        mat-table
        [dataSource]="dataSource"
        matTableExporter
        #exporter="matTableExporter"
        multiTemplateDataRows
        matSort
      >
        <!-- ID Index -->
        <ng-container matColumnDef="index">
          <th
            id="indexI"
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            style="width: 7%"
          >
            N°
          </th>
          <td
            mat-cell
            *matCellDef="let row; let i = dataIndex"
            style="width: 7%"
          >
            {{ i + 1 }}
          </td>
        </ng-container>

        <!-- nombreDescripcion Column -->
        <ng-container matColumnDef="nombreDescripcion">
          <th
            id="nombreDescripcionI"
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            style="width: 23%"
          >
            NOM.DESC.
          </th>
          <td mat-cell *matCellDef="let row" style="width: 23%">
            {{ row.nombreDescripcion }}
          </td>
        </ng-container>

        <!-- tipoCampoResultado Column -->
        <ng-container matColumnDef="tipoCampoResultado">
          <th
            id="tipoCampoResultadoI"
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            style="width: 20%"
          >
            TIP.RES.
          </th>
          <td mat-cell *matCellDef="let row" style="width: 20%">
            {{ row.tipoCampoResultado }}
          </td>
        </ng-container>

        <!-- cantidadDecimales Column -->
        <ng-container matColumnDef="cantidadDecimales">
          <th
            id="cantidadDecimalesI"
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            style="width: 15%"
          >
            DECIM.
          </th>
          <td mat-cell *matCellDef="let row" style="width: 15%">
            {{ row.cantidadDecimales }}
          </td>
        </ng-container>

        <!-- unidadMedida Column -->
        <ng-container matColumnDef="unidadMedida">
          <th
            id="unidadMedidaI"
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            style="width: 15%"
          >
            U.MEDIDA
          </th>
          <td mat-cell *matCellDef="let row" style="width: 15%">
            {{ row.unidadMedida }}
          </td>
        </ng-container>

        <ng-container matColumnDef="opciones">
          <th
            id="opcionesI"
            mat-header-cell
            *matHeaderCellDef
            style="width: 20%; text-align: center"
          >
            <button
              matTooltip="Agregar"
              mat-icon-button
              class="nuevo"
              (click)="agregaExamenEstructura()"
            >
              <mat-icon>add</mat-icon>
            </button>
          </th>

          <td
            mat-cell
            *matCellDef="let row; let i = index"
            style="width: 20%; text-align: center"
          >
            <button
              matTooltip="Modificar"
              mat-icon-button
              class="tabla"
              (click)="modificaExamenEstructura(row)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              matTooltip="Eliminar"
              mat-icon-button
              class="tabla"
              (click)="eliminaExamenEstructura(row)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="example-element-row"
        ></tr>
      </table>
    </div>
  </div>
</div>
