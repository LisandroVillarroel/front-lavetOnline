<div class="container">
  <div class="pt-1">
    <div class="col-md-12">
      <h4 class="text-center">LISTA EXAMEN</h4>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12 alinearDerecha">
      <button
        mat-raised-button
        mat-dialog-close
        class="colorFondoBotonCancelar"
      >
        CERRAR
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col-5">
      <div class="pt-1">
        <div class="col-md-12">
          <h4 class="text-center">LISTA EXAMENES</h4>
        </div>
      </div>

      <div class="row">
        <div class="col-md-5 d-flex align-items-center justify-content-end">
          <button
            mat-raised-button
            class="colorFondoBotonExTabla"
            (click)="
              exporter.exportTable('xlsx', {
                fileName: nombreArchivo,
                sheet: 'facturas',
                Props: { Author: 'Silave' },
                columnWidths: [50, 5, 3]
              })
            "
          >
            Excel
          </button>
          <button
            mat-raised-button
            class="colorFondoBotonExTabla"
            (click)="exporter.exportTable('csv', { fileName: nombreArchivo })"
          >
            Csv
          </button>
          <button
            mat-raised-button
            class="colorFondoBotonExTabla"
            (click)="exporter.exportTable('json', { fileName: nombreArchivo })"
          >
            Json
          </button>
          <button
            mat-raised-button
            class="colorFondoBotonExTabla"
            (click)="exporter.exportTable('txt', { fileName: nombreArchivo })"
          >
            Txt
          </button>
        </div>
        <div class="col-md-7 ml-2 mr-2">
          <mat-form-field class="inputBuscar">
            <mat-icon matPrefix>search</mat-icon>
            <input
              matInput
              (keyup)="applyFilter($event)"
              placeholder="Buscar"
            />
          </mat-form-field>
        </div>
      </div>

      <table
        mat-table
        [dataSource]="dataSource"
        matTableExporter
        #exporter="matTableExporter"
        multiTemplateDataRows
        matSort
      >
        <!-- ID Index -->
        <ng-container matColumnDef="index">
          <th
            id="indexI"
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            style="width: 5%"
          >
            N°
          </th>
          <td
            mat-cell
            *matCellDef="let row; let i = dataIndex"
            style="width: 5%"
          >
            {{ i }}
          </td>
        </ng-container>

        <!-- DESCRIPCIÓN Column -->
        <ng-container matColumnDef="ordenEstructura">
          <th
            id="ordenEstructuraI"
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            style="width: 80%"
          >
            EXAMEN
          </th>
          <td mat-cell *matCellDef="let row" style="width: 80%">
            {{ row.ordenEstructura }}
          </td>
        </ng-container>

        <ng-container matColumnDef="opciones">
          <th
            id="opcionesI"
            mat-header-cell
            *matHeaderCellDef
            style="width: 15%; text-align: center"
          >
            <button
              matTooltip="Agregar"
              mat-icon-button
              class="nuevo"
              (click)="agregaExamenEstructura()"
            >
              <mat-icon>add</mat-icon>
            </button>
          </th>

          <td
            mat-cell
            *matCellDef="let row; let i = index"
            style="width: 15%; text-align: center"
          >
            <button
              matTooltip="Modificar"
              matTooltip="Modificar"
              mat-icon-button
              class="tabla"
              style="size: 5px"
              (click)="actualizaExamenEstructura(row._id)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              matTooltip="Eliminar"
              mat-icon-button
              class="tabla"
              (click)="eliminaExamenEstructura(row)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="example-element-row"
        ></tr>
      </table>
    </div>
  </div>
</div>
