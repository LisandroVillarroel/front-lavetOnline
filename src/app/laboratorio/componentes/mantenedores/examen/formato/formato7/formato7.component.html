<h2 mat-dialog-title>FORMATO EXAMEN {{ data.nombre }}</h2>
<div class="consulta-container">
  <div id="cuerpo" class="mt-3">
    <div class="row">
      <div class="col-md-3 border border-dark alineaV border-end-0 destacado">
        EXAMEN FÍSICO
      </div>
      <div class="col-md-6 border border-dark">
        {{ data.formato?.formato7?.examenFisico }}
      </div>
    </div>

    <div id="coprocultivo" class="mt-3">
      <div class="row anchoTitulo">
        <div
          class="col-md-3 border border-dark alineaVertical border-end-0 destacado"
        >
          EXAMEN QUÍMICO
        </div>
        <div
          class="col-md-3 border border-dark border-left-0 border-end-0 alineaVertical destacado"
        >
          NEGATIVO
        </div>
        <div
          class="col-md-3 border border-dark border-left-0 alineaVertical destacado"
        >
          POSITIVO
        </div>
      </div>
      @for(item of data.formato?.formato7?.resultado; track item){
      <div class="row">
        <div
          class="col-md-3 border border-dark border-top-0 alineaV border-end-0 destacado"
        >
          {{ item.nombre }}
        </div>
        <div
          class="col-md-3 border border-dark border-end-0 border-top-0"
        ></div>
        <div
          class="col-md-3 border border-dark border-left-0 border-top-0"
        ></div>
      </div>
      }
    </div>

    <div class="row">
      <div
        class="col-md-3 border border-dark border-top-0 alineaV border-end-0 destacado"
      >
        CONCLUSIÓN
      </div>
      <div class="col-md-6 border border-dark border-left-0 border-top-0"></div>
    </div>
  </div>

  <div class="col-md-12 mt-5">
    <button
      mat-raised-button
      class="colorFondoBotonCancelar"
      mat-dialog-close
      [disabled]="false"
    >
      CERRAR
    </button>
  </div>
</div>
