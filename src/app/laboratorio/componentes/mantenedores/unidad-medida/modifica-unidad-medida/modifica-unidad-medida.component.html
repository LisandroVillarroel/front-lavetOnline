<h2 mat-dialog-title>MODIFICA UNIDAD MEDIDA</h2>

<mat-dialog-content
  [formGroup]="modificaUnidadMedida()"
  name="modifica"
  class="modifica-container"
>
  <mat-form-field class="inputInput">
    <mat-label class="labelI">Nombre Unidad Medida</mat-label>
    <input
      matInput
      placeholder="Ingrese Nombre"
      [formControl]="nombre"
      required
    />
    @if (nombre.invalid) {
    <mat-error>{{ getErrorMessage("nombre") }}</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
  <div class="col-md-6">
    <button
      mat-raised-button
      class="colorFondoBotonCancelar"
      mat-dialog-close
      [disabled]="false"
    >
      CANCELAR
    </button>
  </div>
  <div class="col-md-6">
    <button
      class="colorFondoBotonGrabar"
      mat-raised-button
      (click)="enviar()"
      [disabled]="modificaUnidadMedida().invalid"
    >
      GRABAR
    </button>
  </div>
</mat-dialog-actions>
